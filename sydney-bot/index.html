ms:flex-end;justify-content:center;padding:18px}.api-popover.open{display:flex}.api-card{width:420px;max-width:100%;background:#fff;border-radius:16px;padding:20px;box-shadow:0 24px 70px rgba(30,25,40,.28)}.api-card h2{font-size:17px;margin:0 0 6px}.api-card p{font-size:12px;color:#766f7a;margin:0 0 14px}.api-card input{width:100%;border:1px solid #ddd4e2;border-radius:10px;padding:11px 12px;outline:0}.api-card input:focus{border-color:var(--accent)}.api-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.api-actions button{border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.api-actions .save{background:var(--accent);color:#fff}.api-actions .close{background:#f1edf3;color:#4c4650}

.rich-content{white-space:normal}.rich-content p{margin:0 0 10px}.rich-content p:last-child{margin-bottom:0}.rich-content h1,.rich-content h2,.rich-content h3{margin:14px 0 8px;line-height:1.35}.rich-content h1{font-size:20px}.rich-content h2{font-size:18px}.rich-content h3{font-size:16px}.rich-content ul,.rich-content ol{margin:8px 0;padding-left:24px}.rich-content blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 7px 7px 0}.rich-content a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}.rich-content :not(pre)>code{font-family:Menlo,Consolas,monospace;font-size:.9em;background:var(--accent-soft);border:1px solid var(--border);border-radius:5px;padding:2px 5px}.code-block{margin:12px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#18202b;color:#e9eef5;box-shadow:0 6px 18px rgba(29,37,48,.12)}.code-toolbar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#222c39;border-bottom:1px solid rgba(255,255,255,.08);color:#aeb9c8;font-size:12px}.code-copy{border:0!important;background:rgba(255,255,255,.08)!important;color:#dce4ee!important;border-radius:6px!important;padding:5px 9px!important;cursor:pointer}.code-copy:hover{background:rgba(255,255,255,.15)!important}.code-block pre{margin:0;overflow:auto;padding:14px 16px;background:transparent}.code-block code{font-family:Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.6;white-space:pre;tab-size:2}.katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:5px 0}.katex{font-size:1.06em}@media(max-width:760px){.code-block code{font-size:12px}.code-block pre{padding:12px}.katex-display{font-size:.92em}}

<body data-mode="creative">
<div class="bg-glow"></div>
<div class="app">
<header class="hero">
  <div class="brand-slot" aria-label="品牌图片预留位"><img id="brandImage" alt=""></div>
  <h1>AI 驱动的 Web 副驾驶</h1>
</header>
<main class="main" id="mainScroll">
  <section class="welcome" id="welcome">
    <div class="suggestions" id="suggestions"></div>
    <div class="fineprint">AI 可能会出现意外或错误，请核对重要信息。</div>
    <div class="mode-title">选择对话风格</div>
    <div class="modes" role="tablist" aria-label="对话风格">
      <button class="mode active" data-mode="creative"><small>更多</small>创造性</button>
      <button class="mode" data-mode="balanced"><small>更多</small>平衡</button>
      <button class="mode" data-mode="precise"><small>更多</small>精准</button>
    </div>
  </section>
  <section class="chat" id="chat" aria-live="polite"></section>
</main>
<section class="composer-zone">
  <div class="composer">
    <button class="new-chat-btn" id="newChatButton" aria-label="开始新对话" title="开始新对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4"></path><path d="M18 2v6m-3-3h6"></path></svg>
    </button>
    <div class="input-wrap">
      <textarea id="input" maxlength="4000" rows="1" placeholder="在这里输入消息"></textarea>
      <div class="input-meta"><span id="count">0</span>/4000</div>
    </div>
    <button class="send-btn" id="sendButton" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.5 11.7 1.9-11.7 1.9-.1 6.5Z"></path></svg>
    </button>
  </div>
  <div class="footer">由 AI 提供支持，结果可能包含错误。</div>
</section>
</div>
<button class="api-fab" id="apiFab" aria-label="设置 API Key" title="设置 API Key">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"></circle><path d="M11 12 20 3m-2 2 2 2m-5 1 2 2"></path></svg>
</button>
<div class="api-popover" id="apiPopover" role="dialog" aria-modal="true" aria-labelledby="apiTitle">
  <div class="api-card">
    <h2 id="apiTitle">续写 API 设置</h2>
    <p>密钥只保存在当前浏览器。模型列表来自所选服务；获取列表不会产生生成请求，也不会把“出现在列表中”误判为支持 /completions。</p>
    <label for="providerInput">服务商</label>
    <select id="providerInput"><option value="deepseek">DeepSeek 官方</option><option value="siliconflow">硅基流动（含 GLM / DeepSeek 等模型）</option><option value="glm">智谱 GLM 官方（续写未获文档确认）</option><option value="custom">自定义兼容服务</option></select>
    <div id="providerNote" class="api-note"></div>
    <label for="apiInput">API Key</label><input id="apiInput" type="password" autocomplete="off" placeholder="输入此服务商的 API Key">
    <label for="baseInput">API Base URL</label><input id="baseInput" type="url" spellcheck="false">
    <label for="protocolInput">续写协议</label><select id="protocolInput"></select>
    <label for="modelInput">模型 ID（可以直接输入并保存）</label>
    <div class="api-inline"><input id="modelInput" list="modelOptions" autocomplete="off" spellcheck="false" placeholder="选择或手动输入模型 ID"><button id="modelRefresh" type="button">获取模型</button></div>
    <datalist id="modelOptions"></datalist>
    <select id="modelSelect" aria-label="已获取和手动添加的模型" style="margin-top:8px"></select>
    <div class="api-inline" style="margin-top:8px"><button class="minor" id="modelAdd" type="button">添加此模型</button><button class="minor" id="modelRemove" type="button">移除手动模型</button></div>
    <div id="modelStatus" class="api-note" role="status"></div>
    <details><summary>高级设置</summary>
      <label for="maxTokensInput">最大输出 tokens</label><input id="maxTokensInput" type="number" min="1" step="1" value="1200">
      <label class="api-check"><input id="samplingInput" type="checkbox" checked>使用原页面的风格采样参数（不兼容时可关闭）</label>
      <label for="promptFile">载入原始聊天记录（本地打开 / prompt-a.txt 加载失败时）</label><input id="promptFile" type="file" accept=".txt,text/plain">
      <div id="promptStatus" class="api-note">默认读取同目录的 prompt-a.txt。</div>
    </details>
    <div class="api-actions"><button class="close" id="apiClose">取消</button><button class="save" id="apiSave">保存</button></div>
  </div>
</div>
<script>
// Official API references checked 2026-09-16:
// DeepSeek FIM: https://api-docs.deepseek.com/guides/fim_completion
// DeepSeek prefix: https://api-docs.deepseek.com/guides/chat_prefix_completion
// SiliconFlow legacy/current Completion API: https://docs.siliconflow.com/cn/api-reference/completion/create-completion
// SiliconFlow Completions guide: https://docs.siliconflow.com/cn/userguide/guides/completions
// SiliconFlow models: https://api-docs.siliconflow.cn/docs/api/models-get
// Zhipu public text APIs currently document chat/completions, not a raw prompt continuation endpoint.
// Important: model discovery != completion capability. SiliconFlow auto mode probes by making the real request.
const PROVIDERS={
 deepseek:{base:'https://api.deepseek.com/beta',protocol:'raw',models:['deepseek-flash','deepseek-v4-pro'],note:'使用 DeepSeek 官方 /beta/completions 原始文本续写（FIM）。模型 ID 实时获取，不按名称猜能力。FIM 最大输出为 4096 tokens。'},
 siliconflow:{base:'https://api.siliconflow.cn/v1',protocol:'silicon-auto',models:[],note:'自动续写：先调用真正的 /v1/completions（prompt → choices[].text）；仅当服务端明确表示该模型/端点不支持 Completion 时，才回退到 SiliconFlow Prefix。不会因为 Qwen/GLM/DeepSeek 名称或“推理模型”标签强制改协议。'},
 glm:{base:'https://open.bigmodel.cn/api/paas/v4',protocol:'unavailable',models:[],note:'智谱官方当前公开文本模型文档只确认 /chat/completions，未确认与本页大段 prompt 续写等价的原始 /completions 接口。本页不把普通聊天冒充文本续写；可通过硅基流动调用其托管的 GLM 并自动探测。'},
 custom:{base:'',protocol:'raw',models:[],note:'填写兼容服务。可直接使用 /completions，也可选择已确认支持的前缀续写协议。'}
};
const PROTOCOLS={
 'silicon-auto':'自动续写：优先 /completions，必要时 Prefix 回退',
 raw:'原始文本续写 /completions',
 'deepseek-prefix':'DeepSeek 前缀续写（assistant.prefix）',
 'silicon-prefix':'SiliconFlow Prefix（兼容回退）',
 unavailable:'官方原始续写接口尚未确认'
};
const SETTINGS_KEY='sydney-completion-settings-v1';
function readSettings(){
 let saved;try{saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null')}catch{}
 const out={provider:PROVIDERS[saved?.provider]?saved.provider:'deepseek',profiles:{}};
 for(const [id,p] of Object.entries(PROVIDERS)){
   const old=saved?.profiles?.[id]||{};
   let protocol=PROTOCOLS[old.protocol]?old.protocol:p.protocol;
   // Previous build forced SiliconFlow to silicon-prefix. Migrate it to raw-first auto mode.
   if(id==='siliconflow' && (!old.protocol || old.protocol==='silicon-prefix')) protocol='silicon-auto';
   if(id==='glm') protocol='unavailable';
   out.profiles[id]={
     key:typeof old.key==='string'?old.key:(id==='deepseek'?localStorage.getItem('deepseek-api-key')||'':''),
     base:typeof old.base==='string'?old.base:p.base,
     protocol,
     model:typeof old.model==='string'?old.model:p.models[0]||'',
     manual:Array.isArray(old.manual)?old.manual.filter(x=>typeof x==='string'):[],
     catalog:Array.isArray(old.catalog)?old.catalog.filter(x=>typeof x==='string'):null,
     catalogBase:old.catalogBase||'',
     fetchedAt:Number(old.fetchedAt)||0,
     maxTokens:Number(old.maxTokens)||1200,
     sampling:old.sampling!==false
   };
 }
 return out;
}

function openApi(){apiDraft=JSON.parse(JSON.stringify(apiSettings));discoveryEpoch++;paintDraft();$('#apiPopover').classList.add('open');setTimeout(()=>$('#apiInput').focus(),30);const c=apiDraft.profiles[apiDraft.provider];if(c.key&&apiDraft.provider!=='glm')refreshDraft();}

async function autoRefreshSaved(){const provider=apiSettings.provider,c=apiSettings.profiles[provider];if(!c.key||provider==='glm'||Date.now()-c.fetchedAt<3600000)return;const snapshot={...c,provider};try{const catalog=await discoverModels(snapshot);if(apiSettings.profiles[provider]!==c||c.key!==snapshot.key||c.base!==snapshot.base)return;c.catalog=catalog;c.catalogBase=c.base;c.fetchedAt=Date.now();localStorage.setItem(SETTINGS_KEY,JSON.stringify(apiSettings));}catch{/* Opening settings provides the actionable error; retain cached/manual models. */}}
$('#providerInput').onchange=()=>{captureDraft();discoveryEpoch++;apiDraft.provider=$('#providerInput').value;paintDraft();if(apiDraft.profiles[apiDraft.provider].key&&apiDraft.provider!=='glm')refreshDraft();};
$('#modelRefresh').onclick=refreshDraft;
$('#apiInput').onchange=()=>{if($('#apiInput').value.trim()&&apiDraft?.provider!=='glm')refreshDraft();};
$('#baseInput').onchange=()=>{captureDraft();discoveryEpoch++;renderModels();if($('#apiInput').value.trim()&&apiDraft?.provider!=='glm')refreshDraft();};
$('#modelSelect').onchange=()=>{if($('#modelSelect').value){$('#modelInput').value=$('#modelSelect').value;captureDraft();}};
$('#modelAdd').onclick=()=>{captureDraft();const c=apiDraft.profiles[apiDraft.provider];if(!c.model)return settingsStatus('请先输入完整模型 ID。',true);if(!c.manual.includes(c.model))c.manual.push(c.model);renderModels();settingsStatus('已添加手动模型，点击保存生效。');};
$('#modelRemove').onclick=()=>{captureDraft();const c=apiDraft.profiles[apiDraft.provider];c.manual=c.manual.filter(x=>x!==c.model);if(!(c.catalog||PROVIDERS[apiDraft.provider].models).includes(c.model)){c.model='';$('#modelInput').value='';}renderModels();settingsStatus('已移除手动记录；官方列表中存在的模型仍会显示。点击保存生效。');};
$('#promptFile').onchange=async()=>{const file=$('#promptFile').files[0];if(!file)return;const text=await file.text();if(!text.trim()){$('#promptStatus').textContent='TXT 为空，未替换原记录。';return;}promptText=text;$('#promptStatus').textContent='已载入 '+file.name+'（本次页面有效）';};
$('#newChatButton').onclick=()=>{if(generating)return;if(!messages.length||confirm('开始新对话？当前对话将被清空。')){messages=[];lastError='';render();main.scrollTo({top:0,behavior:'smooth'});input.focus()}};
$('#apiFab').onclick=openApi;$('#apiClose').onclick=closeApi;
$('#apiSave').onclick=()=>{captureDraft();const c=apiDraft.profiles[apiDraft.provider];try{validateConfig({...c,provider:apiDraft.provider});if(c.model&&!c.manual.includes(c.model)&&!(c.catalog||[]).includes(c.model))c.manual.push(c.model);localStorage.setItem(SETTINGS_KEY,JSON.stringify(apiDraft));apiSettings=JSON.parse(JSON.stringify(apiDraft));lastError='';closeApi();render();autoRefreshSaved();}catch(e){settingsStatus(e.message,true);}};
$('#apiPopover').onclick=e=>{if(e.target.id==='apiPopover')closeApi()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApi();});
input.addEventListener('input',resizeInput);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});send.onclick=sendMessage;document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
loadBrand();buildSuggestions();setMode(mode);promptReady=loadPrompt();resizeInput();render();autoRefreshSaved();
</script>
</body>
</html>
